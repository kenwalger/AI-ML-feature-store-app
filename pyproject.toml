[project]
name = "ai-ml-feature-store"
version = "1.0.0"
description = "AI/ML Feature Store showcasing Heroku Next Generation PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "python-multipart==0.0.6",
    "sqlalchemy==2.0.25",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.1",
    "pgvector==0.2.4",
    "celery==5.3.4",
    "redis==5.0.1",
    "httpx==0.26.0",
    "aiohttp==3.9.1",
    "pandas==2.1.4",
    "numpy==1.26.3",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "python-json-logger==2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

